{% extends "base.html" %}
{% load i18n %}

{% block custom_styles %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="text-center">
    <!-- Иконка ошибки -->
    <div class="mb-4">
      <i class="bi bi-x-circle-fill text-danger display-1"></i>
    </div>
    <!-- Заголовок -->
    <h1 class="mb-3 text-danger fw-bold">{% translate "Su pago no ha sido procesado" %}</h1>
    <!-- Описание -->
    <p class="mb-4 lead text-muted">{% translate "Hubo un problema al procesar su pago." %}</p>
    <!-- Кнопки действий -->
    <div class="d-flex justify-content-center gap-3">
      <a href="{% url 'home' %}" class="btn btn-outline-soft-secondary btn-lg">{% translate "Regresar a la página principal" %}</a>
    </div>
  </div>
</div>
{% endblock %}

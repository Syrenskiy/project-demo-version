{% extends "base.html" %}
{% load i18n static %}

{% block custom_styles %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <h2 class="text-center my-4">{{ title }}</h2>

      <form method="post" class="bg-light p-4 rounded shadow-sm text-start">
        {% csrf_token %}

        <!-- Рейтинг -->
        <div id="rating" class="mb-4">
          <label class="form-label fw-bold">{% translate "Valoración" %}:</label>
          <div class="d-flex justify-content-start">
            {% for i in "12345" %}
              <i class="bi bi-star me-1 star" data-value="{{ i }}" style="font-size: 2rem; cursor: pointer; color: #ddd;"></i>
            {% endfor %}
          </div>
          <input type="hidden" id="rating-input" name="rating" value="0">
        </div>

        <!-- Комментарий -->
        <div class="mb-4">
          <label for="comment" class="form-label fw-bold">{% translate "Comentario" %}:</label>
          {{ form.comment }}
        </div>

        <!-- Кнопка отправки -->
        <button type="submit" class="btn btn-soft-primary w-100">{% translate "Agregar comentario" %}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block custom_js %}
  <script src="{% static 'products/js/stars.js' %}"></script>
{% endblock %}

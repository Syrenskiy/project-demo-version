<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Propuesta de Producto</title>
</head>
<body
  style="font-family: Arial, sans-serif; background-color: #f5f5f5; margin: 0; padding: 0; color: #333; overflow-x: hidden;">

<div
  style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px;">
  <div style="text-align: center; background-color: #1E87F0; color: #ffffff; padding: 20px 0;">
    <h2 style="margin: 0;">Nueva Propuesta de Producto</h2>
    <p style="margin: 0;">Un usuario ha enviado una nueva propuesta.</p>
  </div>
  <div style="padding: 10px;">
    <h1 style="font-size: 22px; color: #333;">Detalles de la Propuesta:</h1>
    <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
      <tr>
        <td style="padding: 10px; border-bottom: 1px solid #ccc; background-color: #f0f0f0; font-weight: bold;">
          Usuario
        </td>
        <td style="padding: 10px; border-bottom: 1px solid #ccc;">{{ suggestion.user }}</td>
      </tr>
      <tr>
        <td style="padding: 10px; border-bottom: 1px solid #ccc; background-color: #f0f0f0; font-weight: bold;">
          Teléfono
        </td>
        <td style="padding: 10px; border-bottom: 1px solid #ccc;">{{ suggestion.phone }}</td>
      </tr>
      <tr>
        <td style="padding: 10px; border-bottom: 1px solid #ccc; background-color: #f0f0f0; font-weight: bold;">Creado
        </td>
        <td style="padding: 10px; border-bottom: 1px solid #ccc;">{{ suggestion.created }}</td>
      </tr>
    </table>

    <h1 style="font-size: 22px; color: #333;">Descripción:</h1>
    <p style="padding: 10px; background-color: #f0f0f0; border-radius: 5px; font-size: 16px;">
      {{ suggestion.description }}
    </p>
    <p style="text-align: center; margin-top: 20px;">
      <a href="{{ domain }}/es/{{ admin_panel }}/products/productsuggestion/{{ suggestion.id }}/change/"
         style="display: inline-block; padding: 10px 20px; background-color: #1E87F0; color: #fff; text-decoration: none; border-radius: 5px;">
        Ver en el Administrador
      </a>
    </p>
  </div>
  <div style="text-align: center; padding: 20px; background-color: #f0f0f0; font-size: 14px; color: #888;">
    <p style="margin: 0;">Princess Castle &copy; {% now "Y" %}</p>
  </div>
</div>

</body>
</html>

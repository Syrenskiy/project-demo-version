{% extends 'base.html' %}
{% load i18n %}

{% block content %}
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="text-center text-soft-primary mb-4">{{ title }}</h2>

            <p class="text-muted mb-3">
              {% translate "Has cambiado exitosamente tu contraseña." %}
            </p>

            <div class="text-center mt-4">
              <a href="{% url 'users:profile' %}"
                 class="btn btn-soft-primary btn-lg">{% translate "Volver al perfil" %}</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

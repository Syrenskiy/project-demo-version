{% extends "base.html" %}
{% load i18n %}

{% block content %}
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="text-center text-success mb-4">{% translate "Contraseña ha sido cambiada" %}</h2>

            <p class="text-muted mb-3">
              {% translate "Felicidades! Has cambiado exitosamente la contraseña de tu cuenta. Úsela para ingresar al sistema." %}
            </p>

            <div class="text-center mt-4">
              <a href="{% url 'users:login' %}" class="btn btn-soft-primary btn-lg">{% translate "Ir a la página de Inicio de Sesión" %}</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
